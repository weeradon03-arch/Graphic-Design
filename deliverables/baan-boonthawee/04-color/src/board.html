<!doctype html>
<html lang="th"><head><meta charset="utf-8">
<style>
@font-face{font-family:DM;font-weight:500;src:url(fonts/node_modules/@fontsource/dm-sans/files/dm-sans-latin-500-normal.woff2)}
@font-face{font-family:DM;font-weight:700;src:url(fonts/node_modules/@fontsource/dm-sans/files/dm-sans-latin-700-normal.woff2)}
@font-face{font-family:Anuphan;font-weight:500;src:url(fonts/node_modules/@fontsource/anuphan/files/anuphan-thai-500-normal.woff2)}
@font-face{font-family:Anuphan;font-weight:700;src:url(fonts/node_modules/@fontsource/anuphan/files/anuphan-thai-700-normal.woff2)}
@font-face{font-family:Fraunces;font-weight:600;src:url(fonts/node_modules/@fontsource/fraunces/files/fraunces-latin-600-normal.woff2)}
@font-face{font-family:Trirong;font-weight:500;src:url(fonts/node_modules/@fontsource/trirong/files/trirong-thai-500-normal.woff2)}
*{box-sizing:border-box;margin:0;padding:0}
body{background:#ddd;font-family:DM,Anuphan,sans-serif;color:#1a1a1a}
.board{width:1600px;height:1000px;background:#F4F4F2;position:relative;overflow:hidden;padding:40px 60px}
.meta{display:flex;justify-content:space-between;font:500 14px DM,Anuphan;letter-spacing:.04em;text-transform:uppercase;opacity:.6}
.title{font:700 30px/1.2 DM,Anuphan;margin-top:10px}
.title small{display:block;font:500 16px/1.5 DM,Anuphan;margin-top:4px;opacity:.75}
.ink{filter:url(#ink)}
.card{position:relative;border-radius:4px;display:flex;flex-direction:column;align-items:center;justify-content:center;overflow:hidden}
.lab{position:absolute;left:14px;top:10px;font:700 13px DM,Anuphan;letter-spacing:.03em;opacity:.7;color:var(--labc,#1a1a1a)}
.en{font:600 30px/1.08 Fraunces,Trirong;letter-spacing:-.01em;color:var(--text)}
.th{font:500 18px/1.6 Fraunces,Trirong;color:var(--text);opacity:.85}
.light{background:var(--paper);--bg:var(--paper)}
.dark{background:var(--main);--bg:var(--main);--frame:var(--paper);--text:var(--paper);--labc:var(--paper)}
.r1{display:grid;grid-template-columns:1fr 1fr 1.6fr;gap:16px;margin-top:18px;height:350px}
.r2{display:grid;grid-template-columns:1.6fr 1fr 1fr;gap:16px;margin-top:16px;height:250px}
.sw{display:flex;margin-top:16px;height:118px;border-radius:4px;overflow:hidden}
.sw div{padding:10px 12px;font:500 13px/1.45 DM,Anuphan;display:flex;flex-direction:column;justify-content:flex-end}
.sw b{font:700 15px DM,Anuphan}
.mono{--win:var(--frame);--bldg:var(--frame);--lit:var(--bg);--paper2:var(--bg)}
.sizes{display:flex;align-items:flex-end;gap:16px}
.oa{width:72px;height:72px;border-radius:50%;display:flex;align-items:center;justify-content:center}
/* summary */
.cmp{display:grid;grid-template-columns:repeat(3,1fr);gap:22px;margin-top:22px;height:790px}
.col{display:flex;flex-direction:column;gap:12px}
.col h3{font:700 22px DM,Anuphan}
.col h3 small{display:block;font:500 14px/1.5 DM,Anuphan;opacity:.7}
.chips{display:flex;height:56px;border-radius:4px;overflow:hidden}
.chips div{flex:1}
/* palettes */
.P1{--main:#B4532F;--frame:var(--main);--paper:#F4EADA;--bldg:#4A2E20;--win:#76533F;--lit:#F7BC4B;--text:#4A2E20}
.P2{--main:#69743F;--frame:var(--main);--paper:#F1E8D6;--bldg:#3D2A1F;--win:#6B5A45;--lit:#F2B04A;--text:#3D2A1F}
.P3{--main:#5A3A27;--frame:var(--main);--paper:#F5ECDD;--bldg:#A9492B;--win:#C97556;--lit:#FFD57E;--text:#5A3A27}
</style></head><body>
<svg width="0" height="0" style="position:absolute"><defs id="defs">
 <filter id="ink"><feTurbulence type="fractalNoise" baseFrequency=".09" numOctaves="3" seed="7"/><feDisplacementMap in="SourceGraphic" scale="1.6"/></filter>
</defs></svg>

<section class="board" id="X0">
 <div class="meta"><span>BAAN BOONTHAWEE — COLOR 01 · ข้อเสนอคู่สี</span><span>โลโก้แบบ 2</span></div>
 <div class="title">เสนอ 3 คู่สี: เลือกชุดที่ชอบ<small>ทุกชุด: กระดาษครีม + ไฟเหลืองอุ่นเป็นจุดสว่างที่สุด · ต่างกันที่สีกรอบแสตมป์และสีตึก</small></div>
 <div class="cmp" id="cmp"></div>
</section>
<div id="pages"></div>

<script>
const NS='http://www.w3.org/2000/svg';
function frame(r=3.2,nx=8,ny=9){
 let s=`<rect x="10" y="6" width="80" height="88" style="fill:var(--frame)"/><g style="fill:var(--bg)">`;
 for(let i=0;i<=nx;i++){const x=10+80*i/nx;s+=`<circle cx="${x}" cy="6" r="${r}"/><circle cx="${x}" cy="94" r="${r}"/>`}
 for(let j=0;j<=ny;j++){const y=6+88*j/ny;s+=`<circle cx="10" cy="${y}" r="${r}"/><circle cx="90" cy="${y}" r="${r}"/>`}
 return s+`</g><rect x="17" y="13" width="66" height="74" style="fill:var(--paper2,var(--paper))"/>`;
}
const B='style="fill:var(--bldg)"', W='style="fill:var(--win)"', L='style="fill:var(--lit)"';
const win=(x,y,w,h,lit)=>`<rect x="${x}" y="${y}" width="${w}" height="${h}" ${lit?L:W}/>`;
const V2=frame()+`<rect x="21" y="21" width="58" height="5" ${B}/><rect x="24" y="25" width="52" height="62" ${B}/>`+win(30,33,16,17)+win(54,33,16,17,1)+win(30,56,16,17)+win(54,56,16,17)+`<path d="M44,87 v-7 a6,6 0 0 1 12,0 v7z" ${W}/>`;
const s=document.createElementNS(NS,'symbol');s.id='M';s.setAttribute('viewBox','0 0 100 100');s.innerHTML=V2;document.getElementById('defs').appendChild(s);
const mark=n=>`<svg class="ink" width="${n}" height="${n}"><use href="#M"/></svg>`;

const P=[
 {c:'P1',name:'1 · ดินเผายามค่ำ',en:'Terracotta Night',why:'กรอบดินเผา ตึกน้ำตาลเข้ม — ใกล้ส้มอิฐของคาเฟ่ที่สุด เชื่อมเครือชัด',
  sw:[['พื้น 60%','ครีมกระดาษ','#F4EADA'],['หลัก 30%','ดินเผา','#B4532F'],['ตัวหนังสือ/ตึก','น้ำตาลไม้เข้ม','#4A2E20'],['หน้าต่างดับ','น้ำตาลหม่น','#76533F'],['เน้น 10%','ไฟเหลืองอุ่น','#F7BC4B']]},
 {c:'P2',name:'2 · มะกอกบ้านไม้',en:'Olive Home',why:'กรอบเขียวมะกอก ตึกไม้เข้ม — สงบ ร่มรื่น ต่างจากคาเฟ่แต่ยังโยงด้วยมะกอก',
  sw:[['พื้น 60%','ครีมลินิน','#F1E8D6'],['หลัก 30%','เขียวมะกอก','#69743F'],['ตัวหนังสือ/ตึก','น้ำตาลไม้','#3D2A1F'],['หน้าต่างดับ','น้ำตาลเทา','#6B5A45'],['เน้น 10%','ไฟเหลืองอุ่น','#F2B04A']]},
 {c:'P3',name:'3 · ตึกอิฐ กรอบไม้',en:'Brick & Wood',why:'ตึกเป็นสีอิฐ กรอบน้ำตาลไม้ — ตึกเองคือสีอุ่น ดูเป็นบ้านมากที่สุด',
  sw:[['พื้น 60%','ครีมนม','#F5ECDD'],['หลัก 30%','อิฐดินเผา','#A9492B'],['กรอบ/ตัวหนังสือ','น้ำตาลไม้','#5A3A27'],['หน้าต่างดับ','อิฐอ่อน','#C97556'],['เน้น 10%','ไฟเหลืองนวล','#FFD57E']]},
];
const rgb=h=>[1,3,5].map(i=>parseInt(h.substr(i,2),16)).join(' ');
const lum=h=>{const [r,g,b]=[1,3,5].map(i=>parseInt(h.substr(i,2),16)/255).map(v=>v<=.03928?v/12.92:Math.pow((v+.055)/1.055,2.4));return .2126*r+.7152*g+.0722*b};

document.getElementById('cmp').innerHTML=P.map(p=>`<div class="col ${p.c}">
 <h3>${p.name}<small>${p.en} — ${p.why}</small></h3>
 <div class="card light" style="flex:1.5">${mark(170)}<div class="en" style="margin-top:12px;font-size:26px">Baan Boonthawee</div><div class="th" style="font-size:16px">บ้านบุญทวี</div></div>
 <div class="card dark" style="flex:1"><div style="display:flex;gap:18px;align-items:center">${mark(110)}<div><div class="en" style="font-size:24px">Baan<br>Boonthawee</div><div class="th" style="font-size:15px">บ้านบุญทวี อพาร์ทเม้น</div></div></div></div>
 <div class="chips">${p.sw.map(x=>`<div style="background:${x[2]}"></div>`).join('')}</div></div>`).join('');

document.getElementById('pages').innerHTML=P.map((p,i)=>`<section class="board ${p.c}" id="X${i+1}">
 <div class="meta"><span>BAAN BOONTHAWEE — COLOR 01 · ร่าง CI</span><span>ชุดสี ${p.name}</span></div>
 <div class="title">${p.name} <span style="font-weight:500;opacity:.6">${p.en}</span><small>${p.why}</small></div>
 <div class="r1">
  <div class="card light"><div class="lab">A · สแตมป์อย่างเดียว</div>${mark(200)}</div>
  <div class="card light"><div class="lab">B · แนวตั้ง</div>${mark(150)}<div class="en" style="margin-top:12px">Baan Boonthawee</div><div class="th">บ้านบุญทวี</div></div>
  <div class="card light"><div class="lab">C · แนวนอน</div><div style="display:flex;gap:22px;align-items:center">${mark(150)}<div><div class="en" style="font-size:40px">Baan<br>Boonthawee</div><div class="th" style="font-size:20px;margin-top:4px">บ้านบุญทวี อพาร์ทเม้น</div></div></div></div>
 </div>
 <div class="r2">
  <div class="card dark"><div class="lab">C บนพื้นสีหลัก</div><div style="display:flex;gap:20px;align-items:center">${mark(120)}<div><div class="en" style="font-size:34px">Baan<br>Boonthawee</div><div class="th" style="font-size:18px">บ้านบุญทวี อพาร์ทเม้น</div></div></div></div>
  <div class="card light"><div class="lab">สีเดียว (ตรายาง / พิมพ์ขาวดำ)</div><div style="display:flex;gap:22px">
   <div class="mono" style="--frame:var(--text);--bg:var(--paper)">${mark(110)}</div>
   <div class="mono" style="--frame:var(--paper);--bg:var(--text);background:var(--text);padding:8px">${mark(94)}</div></div></div>
  <div class="card light"><div class="lab">Line OA · 48 · 24 px</div><div class="sizes">
   <div class="oa" style="background:var(--main);--bg:var(--main);--frame:var(--paper)">${mark(52)}</div>
   <div class="oa" style="background:var(--paper);border:1.5px solid #0002">${mark(52)}</div>
   <svg width="48" height="48"><use href="#M"/></svg><svg width="24" height="24"><use href="#M"/></svg></div></div>
 </div>
 <div class="sw">${p.sw.map(x=>{const dark=lum(x[2])<.35;return `<div style="flex:${x[0].includes('60')?2.2:x[0].includes('30')?1.6:1};background:${x[2]};color:${dark?'#fff':'#2a1a12'}"><b>${x[1]}</b>${x[0]}<br>${x[2]} · RGB ${rgb(x[2])}</div>`}).join('')}</div>
</section>`).join('');
</script>
</body></html>
