<!doctype html>
<html lang="th"><head><meta charset="utf-8">
<!--
  Draft board (step 3 of the graphic-designer workflow): grey-scale thumbnails
  so the user picks form and layout before colour and detail.
  - 6 numbered thumbnails per board (3×2). Keep marks in black/greys only.
  - No final fonts needed: use a plain sans for type placeholders, or blocks for text.
  - Label each thumbnail with a number + one-line idea, so the user can answer "เอาเบอร์ 2 กับ 5".
-->
<style>
@font-face{font-family:DM;font-weight:500;src:url(fonts/node_modules/@fontsource/dm-sans/files/dm-sans-latin-500-normal.woff2)}
@font-face{font-family:DM;font-weight:700;src:url(fonts/node_modules/@fontsource/dm-sans/files/dm-sans-latin-700-normal.woff2)}
@font-face{font-family:Anuphan;font-weight:500;src:url(fonts/node_modules/@fontsource/anuphan/files/anuphan-thai-500-normal.woff2)}
@font-face{font-family:Anuphan;font-weight:700;src:url(fonts/node_modules/@fontsource/anuphan/files/anuphan-thai-700-normal.woff2)}
*{box-sizing:border-box;margin:0;padding:0}
body{background:#ddd;font-family:DM,Anuphan,sans-serif;color:#1a1a1a}
.board{width:1600px;height:1000px;background:#F4F4F2;position:relative;overflow:hidden;padding:48px 60px}
.meta{display:flex;justify-content:space-between;font:500 14px DM,Anuphan;letter-spacing:.04em;text-transform:uppercase;opacity:.6}
.title{font:700 34px/1.1 DM,Anuphan;margin-top:14px}
.title small{display:block;font:500 16px/1.5 DM,Anuphan;margin-top:6px;opacity:.7}
.thumbs{display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(2,1fr);gap:20px;margin-top:24px;height:760px}
.th{background:#fff;border:1.5px solid #d6d6d2;position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center}
.num{position:absolute;left:14px;top:10px;font:700 28px DM;color:#1a1a1a}
.idea{position:absolute;left:14px;right:14px;bottom:10px;font:500 14px/1.4 DM,Anuphan;opacity:.75}
/* sketchy line look for draft marks */
.sk{filter:url(#rough)}
.block{background:#cfcfcb;border-radius:3px}
</style></head><body>
<svg width="0" height="0" style="position:absolute"><defs>
 <filter id="rough"><feTurbulence type="fractalNoise" baseFrequency=".04" numOctaves="2" seed="2"/><feDisplacementMap in="SourceGraphic" scale="3"/></filter>
</defs></svg>

<section class="board" id="D1">
 <div class="meta"><span>BRAND — DRAFT · ดราฟต์ ยังไม่ใช่งานจริง</span><span>ทิศทาง A</span></div>
 <div class="title">ดราฟต์ทิศทาง A: เลือกเบอร์ที่ชอบ<small>ขาวดำเพื่อดูฟอร์มและการจัดวางก่อน สีและฟอนต์จริงจะใส่หลังเลือกแล้ว</small></div>
 <div class="thumbs">
  <div class="th"><div class="num">1</div>
   <svg class="sk" width="180" height="180" viewBox="0 0 100 100"><circle cx="50" cy="50" r="38" fill="none" stroke="#1a1a1a" stroke-width="5"/></svg>
   <div style="width:60%;height:18px;margin-top:14px" class="block"></div><div style="width:40%;height:12px;margin-top:8px" class="block"></div>
   <div class="idea">ไอเดียหนึ่งบรรทัด</div></div>
  <div class="th"><div class="num">2</div><div class="idea">…</div></div>
  <div class="th"><div class="num">3</div><div class="idea">…</div></div>
  <div class="th"><div class="num">4</div><div class="idea">…</div></div>
  <div class="th"><div class="num">5</div><div class="idea">…</div></div>
  <div class="th"><div class="num">6</div><div class="idea">…</div></div>
 </div>
</section>
</body></html>
